<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0f16">
<title>下棋天地 · 离线版</title>
<link rel="manifest" id="pwaManifest">
<style>
/* ============================================================
   全局变量 · 深色主题 · 统一光源
   ============================================================ */
:root{
  --bg-0:#070b11;--bg-1:#0d131b;--bg-2:#141c26;--bg-3:#1b2531;
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);
  --text-0:#e8eef5;--text-1:#b8c6d5;--text-2:#7d8fa3;--text-3:#54637a;
  --gold-0:#ffe9a8;--gold-1:#e0a94a;--gold-2:#b57c1f;
  --green:#7be0a5;--red:#ef8a8a;--blue:#8fc2ef;--gray:#a8bdd0;--purple:#c8a8ff;
  --shadow-lg:0 18px 40px rgba(0,0,0,.65);
  --shadow-md:0 8px 22px rgba(0,0,0,.45);
  --shadow-sm:0 3px 10px rgba(0,0,0,.35);
  /* 统一光源：光从左上照向右下 */
  --light-from-x:32%;--light-from-y:28%;
  --shadow-dx:-2px;--shadow-dy:4px;
  /* 字号缩放（大字号模式） */
  --fs-scale:1;
}
body.font-large{--fs-scale:1.25;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  background:
    radial-gradient(circle at 50% -10%, #1c2c40 0%, #0d131b 45%, #05080d 100%),
    radial-gradient(circle at 15% 85%, rgba(224,169,74,.05), transparent 55%),
    radial-gradient(circle at 85% 10%, rgba(120,160,220,.05), transparent 45%);
  background-attachment:fixed;color:var(--text-0);min-height:100vh;
  -webkit-font-smoothing:antialiased;
  font-size:calc(1em * var(--fs-scale));
  transition:font-size .3s;
}
/* === 优化 12：背景星尘粒子层 === */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    radial-gradient(1px 1px at 12% 23%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1px 1px at 27% 68%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1.5px 1.5px at 43% 12%, rgba(255,224,180,.45), transparent 60%),
    radial-gradient(1px 1px at 58% 45%, rgba(255,255,255,.28), transparent 60%),
    radial-gradient(1.2px 1.2px at 73% 79%, rgba(200,220,255,.4), transparent 60%),
    radial-gradient(1px 1px at 86% 31%, rgba(255,255,255,.32), transparent 60%),
    radial-gradient(1.4px 1.4px at 92% 62%, rgba(255,224,180,.38), transparent 60%),
    radial-gradient(1px 1px at 6% 87%, rgba(255,255,255,.3), transparent 60%),
    radial-gradient(1px 1px at 35% 92%, rgba(200,220,255,.32), transparent 60%),
    radial-gradient(1.2px 1.2px at 65% 8%, rgba(255,255,255,.35), transparent 60%);
  background-size:600px 600px;
  animation:starDrift 180s linear infinite;
  opacity:.55;
}
@keyframes starDrift{
  from{background-position:0 0}
  to{background-position:-600px 600px}
}
body.power-save::before{animation:none;opacity:.25}

#app{max-width:900px;margin:0 auto;padding:18px 14px 60px}
@media(min-width:1100px){#app{max-width:1120px}}

/* ============================================================
   优化 29：大屏侧栏
   ============================================================ */
.game-layout{display:block}
@media(min-width:960px){
  .game-layout.has-sidebar{display:grid;grid-template-columns:1fr 260px;gap:20px;align-items:start}
}
.side-panel{display:none}
@media(min-width:960px){.side-panel{display:block}}
.side-panel .mini-panel{
  padding:14px;border-radius:14px;margin-bottom:12px;
  background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
  border:1px solid var(--line);
  box-shadow:var(--shadow-sm),inset 0 1px 0 rgba(255,255,255,.05);
}
.side-panel h3{
  margin:0 0 10px;font-size:12px;letter-spacing:2px;color:var(--gold-0);
  display:flex;align-items:center;gap:8px;
}
.side-panel h3::before{
  content:"";width:3px;height:12px;border-radius:2px;
  background:linear-gradient(180deg,#ffe9a8,#c9922e);
}
.side-panel .info-row{
  display:flex;justify-content:space-between;
  padding:5px 0;font-size:12px;color:var(--text-1);
  border-bottom:1px solid rgba(255,255,255,.04);
}
.side-panel .info-row:last-child{border-bottom:none}
.side-panel .info-row .k{color:var(--text-2)}
.side-panel .info-row .v{font-weight:700;color:var(--gold-0);font-variant-numeric:tabular-nums}

/* ============================================================
   右上角设置按钮
   ============================================================ */
.settings-fab{
  position:fixed;top:18px;right:18px;z-index:500;
  width:48px;height:48px;border-radius:50%;
  background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02)),
    linear-gradient(160deg,rgba(25,35,48,.85),rgba(10,15,22,.95));
  border:1px solid var(--line-2);
  color:var(--gold-0);font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-md),inset 0 1px 0 rgba(255,255,255,.1);
  transition:transform .25s cubic-bezier(.2,.8,.3,1),box-shadow .25s,border-color .25s,color .25s;
  font-family:inherit;
}
.settings-fab svg{width:22px;height:22px}
.settings-fab:hover{
  transform:rotate(45deg) scale(1.08);
  border-color:rgba(224,169,74,.65);color:#fff2cf;
  box-shadow:0 12px 28px rgba(224,169,74,.32),
    0 0 0 1px rgba(224,169,74,.25) inset;
}
.settings-fab:active{transform:rotate(45deg) scale(.96)}
@media(max-width:620px){
  .settings-fab{top:12px;right:12px;width:42px;height:42px}
  .settings-fab svg{width:19px;height:19px}
}

/* ============================================================
   头部
   ============================================================ */
header#hdr{text-align:center;padding:12px 0 18px}
header#hdr h1{
  margin:0;font-size:34px;letter-spacing:8px;font-weight:800;
  background:linear-gradient(180deg,#fff8dd,#e8b958 45%,#a8741a);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 12px rgba(224,169,74,.4));
}
header#hdr p{margin:8px 0 0;color:var(--text-2);font-size:12px;letter-spacing:5px}
header#hdr p::before,header#hdr p::after{content:"·";margin:0 8px;color:var(--gold-1);opacity:.5}

/* ============================================================
   大厅：棋类卡片
   ============================================================ */
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:720px){.menu{grid-template-columns:repeat(3,1fr);gap:10px}}
@media(max-width:480px){.menu{grid-template-columns:repeat(2,1fr);gap:9px}}
.card{
  position:relative;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.012)),
    linear-gradient(160deg,rgba(20,28,38,.6),rgba(10,15,22,.9));
  border:1px solid var(--line);border-radius:14px;
  padding:16px 8px 12px;text-align:center;cursor:pointer;
  transition:transform .25s cubic-bezier(.2,.8,.3,1),box-shadow .25s,border-color .25s;
  user-select:none;
  box-shadow:var(--shadow-sm),inset 0 1px 0 rgba(255,255,255,.06);
}
.card::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%,rgba(224,169,74,.14),transparent 60%);
  opacity:0;transition:opacity .35s;pointer-events:none;
}
/* === 优化 14：卡片微光扫过 === */
.card::after{
  content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;
  background:linear-gradient(105deg,transparent 0%,
    rgba(255,255,255,.16) 45%,rgba(255,255,255,.28) 50%,
    rgba(255,255,255,.16) 55%,transparent 100%);
  transform:skewX(-18deg);pointer-events:none;
  transition:left .8s cubic-bezier(.2,.8,.3,1);
}
.card:hover{transform:translateY(-4px);border-color:rgba(224,169,74,.55);
  box-shadow:0 16px 32px rgba(0,0,0,.55),
    0 0 0 1px rgba(224,169,74,.2) inset,0 0 24px rgba(224,169,74,.14)}
.card:hover::before{opacity:1}
.card:hover::after{left:120%}
.card .icon{
  width:34px;height:34px;margin:0 auto 8px;display:block;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));
  transition:transform .3s;
  color:var(--gold-0);
}
.card .icon svg{width:100%;height:100%;display:block}
.card:hover .icon{transform:scale(1.14) rotate(-4deg)}
.card .name{font-size:14.5px;font-weight:700;letter-spacing:1.5px;color:#f5e8cc}
.card .desc{font-size:10px;color:var(--text-3);margin-top:5px;line-height:1.4;height:24px;overflow:hidden}

/* ============================================================
   大厅下方子页面入口
   ============================================================ */
.lobby-nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
@media(max-width:620px){.lobby-nav{grid-template-columns:1fr;gap:10px}}
.nav-card{
  display:flex;align-items:center;gap:14px;
  padding:16px 18px;border-radius:14px;cursor:pointer;
  background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.012)),
    linear-gradient(160deg,rgba(20,28,38,.5),rgba(10,15,22,.75));
  border:1px solid var(--line);color:var(--text-0);font-family:inherit;
  text-align:left;transition:transform .22s,box-shadow .22s,border-color .22s;
  box-shadow:var(--shadow-sm),inset 0 1px 0 rgba(255,255,255,.06);
  position:relative;overflow:hidden;
}
.nav-card::after{
  content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.1),transparent);
  transform:skewX(-18deg);transition:left .8s;pointer-events:none;
}
.nav-card:hover::after{left:120%}
.nav-card:hover{
  transform:translateY(-3px);border-color:rgba(224,169,74,.5);
  box-shadow:0 12px 28px rgba(0,0,0,.5),
    0 0 0 1px rgba(224,169,74,.15) inset;
}
.nav-card .nc-icon{
  width:26px;height:26px;flex-shrink:0;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));
  color:var(--gold-0);
}
.nav-card .nc-icon svg{width:100%;height:100%;display:block}
.nav-card .nc-title{font-size:14px;font-weight:700;letter-spacing:1.5px;color:#f5e8cc}
.nav-card .nc-sub{font-size:11px;color:var(--text-2);margin-top:4px;letter-spacing:.5px}

/* ============================================================
   子页面通用
   ============================================================ */
.sub-header{
  display:grid;grid-template-columns:auto 1fr auto;
  align-items:center;gap:12px;margin-bottom:18px;
}
.sub-header h2{
  margin:0;font-size:18px;font-weight:800;letter-spacing:3px;
  color:var(--gold-0);text-align:center;
  text-shadow:0 2px 10px rgba(224,169,74,.3);
}

/* 页面切换过渡（优化 21 隐含） */
.view{animation:viewIn .28s cubic-bezier(.2,.8,.3,1)}
@keyframes viewIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

/* ============================================================
   面板
   ============================================================ */
.panel{
  padding:18px;border-radius:16px;
  background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.01)),
    linear-gradient(160deg,rgba(20,28,38,.45),rgba(10,15,22,.7));
  border:1px solid var(--line);
  box-shadow:var(--shadow-md),inset 0 1px 0 rgba(255,255,255,.05);
}
.panel h2{
  margin:0 0 14px;font-size:15px;letter-spacing:3px;color:#e8d29a;
  display:flex;align-items:center;gap:10px;
}
.panel h2::before{
  content:"";width:4px;height:16px;border-radius:2px;
  background:linear-gradient(180deg,#ffe9a8,#c9922e);
}
.panel h2 .panel-count{
  margin-left:auto;font-size:11px;letter-spacing:1px;
  color:var(--text-2);font-weight:400;
}
.stats-row{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));
  gap:10px;margin-bottom:16px;
}
.stat-box{
  padding:12px 8px;border-radius:12px;text-align:center;
  background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.stat-box .k{font-size:11px;color:var(--text-2);letter-spacing:1px;margin-bottom:6px}
.stat-box .v{
  font-size:20px;font-weight:800;letter-spacing:1px;
  font-variant-numeric:tabular-nums;
}
.stat-box.score .v{color:#ffd987;text-shadow:0 0 14px rgba(255,217,135,.4)}
.stat-box.win .v{color:var(--green)}
.stat-box.lose .v{color:var(--red)}
.stat-box.draw .v{color:var(--blue)}
.stat-box.abandon .v{color:var(--gray)}
.stat-box.time .v{color:var(--purple);font-size:16px}

.records-list{
  max-height:440px;overflow-y:auto;border-radius:12px;
  background:rgba(0,0,0,.22);border:1px solid var(--line);
}
.records-list::-webkit-scrollbar{width:6px}
.records-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
.records-empty{
  padding:34px 20px;text-align:center;color:var(--text-3);
  font-size:13px;letter-spacing:1px;line-height:1.8;
}
.record-row{
  display:grid;grid-template-columns:136px 1fr auto auto;
  align-items:center;gap:10px;padding:10px 14px;
  font-size:12.5px;border-bottom:1px solid rgba(255,255,255,.04);
  transition:background .15s;
}
.record-row:last-child{border-bottom:none}
.record-row:hover{background:rgba(255,255,255,.035)}
.record-row .time{
  color:var(--text-2);font-family:ui-monospace,"SF Mono",monospace;
  font-size:11px;letter-spacing:.2px;font-variant-numeric:tabular-nums;
}
.record-row .game{color:#e8e0c8;font-weight:600;letter-spacing:.5px}
.record-row .diff{
  font-size:10.5px;padding:2px 8px;border-radius:6px;letter-spacing:.5px;
  background:rgba(255,255,255,.05);color:var(--text-1);
}
.record-row .diff.easy{background:rgba(80,200,120,.14);color:#8fe0aa}
.record-row .diff.mid{background:rgba(255,200,80,.14);color:#ffd987}
.record-row .diff.hard{background:rgba(255,100,100,.14);color:#ff9a9a}
.record-row .result{
  font-weight:800;letter-spacing:1px;font-size:12px;white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.record-row .result.win{color:var(--green)}
.record-row .result.lose{color:var(--red)}
.record-row .result.draw{color:var(--blue)}
.record-row .result.abandon{color:var(--gray)}
.panel-foot{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:12px;font-size:12px;color:var(--text-2);gap:10px;flex-wrap:wrap;
}
.panel-foot .btn{padding:5px 12px;font-size:11.5px}

/* ============================================================
   里程碑
   ============================================================ */
.milestone-progress{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;border-radius:14px;margin-bottom:16px;
  background:linear-gradient(160deg,rgba(224,169,74,.14),rgba(224,169,74,.02));
  border:1px solid rgba(224,169,74,.28);
  box-shadow:0 4px 18px rgba(224,169,74,.1),inset 0 1px 0 rgba(255,255,255,.08);
}
.milestone-progress .ring{width:56px;height:56px;flex-shrink:0;position:relative}
.milestone-progress .ring svg{transform:rotate(-90deg);display:block}
.milestone-progress .ring .pct{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:800;color:var(--gold-0);
  font-variant-numeric:tabular-nums;
}
.milestone-progress .info{flex:1;min-width:0}
.milestone-progress .title{font-size:14px;color:var(--gold-0);font-weight:700;letter-spacing:1px}
.milestone-progress .sub{font-size:11.5px;color:var(--text-2);margin-top:4px}
.milestone-group{margin-bottom:20px}
.milestone-group-title{
  font-size:12px;letter-spacing:2px;color:var(--text-1);
  margin:0 0 10px;padding-left:10px;position:relative;
}
.milestone-group-title::before{
  content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:12px;border-radius:2px;
  background:linear-gradient(180deg,#ffe9a8,#c9922e);
}
.milestone-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;
}
.milestone{
  padding:12px 10px;border-radius:12px;text-align:center;
  background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
  border:1px solid var(--line);
  transition:.25s;position:relative;overflow:hidden;
}
.milestone.locked{opacity:.45;filter:grayscale(.7)}
.milestone.unlocked{
  border-color:rgba(224,169,74,.4);
  background:linear-gradient(160deg,rgba(224,169,74,.14),rgba(224,169,74,.02));
  box-shadow:0 4px 16px rgba(224,169,74,.18),inset 0 1px 0 rgba(255,255,255,.1);
}
.milestone .m-icon{
  width:26px;height:26px;margin:0 auto 6px;display:block;
  color:var(--gold-0);
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));
}
.milestone .m-icon svg{width:100%;height:100%;display:block}
.milestone.unlocked .m-icon{animation:milestoneGlow 3s ease-in-out infinite}
@keyframes milestoneGlow{
  0%,100%{filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
  50%{filter:drop-shadow(0 3px 10px rgba(255,217,135,.75))}
}
.milestone .m-name{
  font-size:12px;font-weight:700;color:#e8dcc0;letter-spacing:.5px;margin-bottom:3px;
}
.milestone.unlocked .m-name{color:var(--gold-0)}
.milestone .m-desc{
  font-size:10px;color:var(--text-3);line-height:1.4;letter-spacing:.2px;
}
/* === 优化 31：成就徽章样式 === */
.milestone .m-tier{
  position:absolute;top:6px;right:6px;
  width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:900;
  border-radius:50%;
  background:
    radial-gradient(circle at 32% 28%, rgba(255,255,255,.5), transparent 60%),
    linear-gradient(160deg,#666,#333);
  color:#fff;
  box-shadow:
    0 1px 3px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.4),
    inset 0 -1px 2px rgba(0,0,0,.3);
  text-shadow:0 1px 1px rgba(0,0,0,.6);
  border:1px solid rgba(0,0,0,.4);
}
.milestone .m-tier.bronze{
  background:radial-gradient(circle at 32% 28%, rgba(255,220,180,.55), transparent 60%),
    linear-gradient(160deg,#c88a5a,#7a4a20);
  border-color:#5a3315;
}
.milestone .m-tier.silver{
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.7), transparent 60%),
    linear-gradient(160deg,#d8dde2,#8a9098);
  border-color:#5a6068;
  color:#2a2a2a;text-shadow:0 1px 1px rgba(255,255,255,.7);
}
.milestone .m-tier.gold{
  background:radial-gradient(circle at 32% 28%, rgba(255,255,210,.85), transparent 60%),
    linear-gradient(160deg,#ffd970,#b8881a);
  border-color:#7a5510;
  color:#3a2400;text-shadow:0 1px 1px rgba(255,255,220,.75);
}
.milestone .m-tier.platinum{
  background:radial-gradient(circle at 32% 28%, rgba(240,250,255,.9), transparent 60%),
    linear-gradient(160deg,#d8e8f0,#7a9aaa);
  border-color:#4a6a7a;
  color:#1a2a35;text-shadow:0 1px 1px rgba(255,255,255,.7);
}
.milestone .m-tier.diamond{
  background:radial-gradient(circle at 32% 28%, rgba(220,250,255,.95), transparent 60%),
    linear-gradient(160deg,#a8e8f8,#3a7a9a);
  border-color:#2a5a7a;
  color:#0a2a3a;text-shadow:0 1px 1px rgba(220,250,255,.8);
}
.milestone .m-tier.legend{
  background:radial-gradient(circle at 32% 28%, rgba(255,220,255,.9), transparent 60%),
    linear-gradient(160deg,#e8a8f0,#7a2a9a);
  border-color:#5a1a7a;
  color:#2a0a3a;text-shadow:0 1px 1px rgba(255,220,255,.8);
  animation:legendPulse 2.5s ease-in-out infinite;
}
@keyframes legendPulse{
  0%,100%{box-shadow:0 1px 3px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.4),
    inset 0 -1px 2px rgba(0,0,0,.3),0 0 0 0 rgba(255,154,240,.6)}
  50%{box-shadow:0 1px 3px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.4),
    inset 0 -1px 2px rgba(0,0,0,.3),0 0 10px 2px rgba(255,154,240,.65)}
}
.milestone .m-progress{
  height:3px;border-radius:2px;background:rgba(255,255,255,.06);
  margin-top:8px;overflow:hidden;
}
.milestone .m-progress .bar{
  height:100%;border-radius:2px;
  background:linear-gradient(90deg,#ffe9a8,#e0a94a);
  transition:width .5s ease-out;
}

/* ============================================================
   继续上局横幅
   ============================================================ */
.resume-banner{
  display:flex;align-items:center;gap:14px;
  margin:0 0 16px;padding:14px 18px;border-radius:14px;
  background:linear-gradient(160deg,rgba(224,169,74,.16),rgba(224,169,74,.03));
  border:1px solid rgba(224,169,74,.4);
  box-shadow:0 6px 22px rgba(224,169,74,.15),inset 0 1px 0 rgba(255,255,255,.1);
  animation:slideIn .35s ease-out;
}
.resume-banner .resume-icon{
  width:28px;height:28px;color:var(--gold-0);
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.5));
}
.resume-banner .resume-icon svg{width:100%;height:100%}
.resume-banner .resume-text{flex:1;min-width:0}
.resume-banner .resume-title{
  font-size:13.5px;color:var(--gold-0);font-weight:700;letter-spacing:1px;
}
.resume-banner .resume-desc{font-size:11.5px;color:var(--text-2);margin-top:3px}
.resume-banner .resume-actions{display:flex;gap:8px}
.resume-banner .btn{padding:6px 12px;font-size:12px}

/* ============================================================
   游戏视图
   ============================================================ */
.hidden{display:none !important}
/* === 优化 13：对局时背景聚焦暗化 === */
body.in-game::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(circle at 50% 40%, transparent 30%, rgba(0,0,0,.35) 100%);
  animation:fadeInOverlay .4s ease-out;
}
#gameView{position:relative;z-index:2}

.topbar{
  display:grid;grid-template-columns:auto 1fr auto auto auto;gap:10px;
  align-items:center;margin-bottom:12px;
}
/* === 优化 27：小屏折叠 === */
@media(max-width:820px){
  .topbar{
    grid-template-columns:auto 1fr auto;
    grid-template-areas:
      "back title menu"
      "diff diff diff";
    gap:8px;
  }
  #backBtn{grid-area:back}
  #gameTitle{grid-area:title;text-align:center;font-size:16px}
  #restartBtn{display:none}
  #ruleBtn{display:none}
  #topMenuBtn{grid-area:menu;display:flex}
  #difficultyPicker{grid-area:diff;justify-self:center}
}
#topMenuBtn{display:none}
.top-menu-popup{
  position:absolute;top:0;right:0;z-index:200;
  min-width:140px;padding:6px;border-radius:12px;
  background:linear-gradient(160deg,#233240,#101820);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 12px 32px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08);
  animation:modalPop .18s cubic-bezier(.2,1.2,.4,1);
  display:flex;flex-direction:column;gap:2px;
}
.top-menu-popup button{
  background:transparent;border:none;color:var(--text-0);
  padding:10px 14px;text-align:left;border-radius:8px;
  font-family:inherit;font-size:13px;cursor:pointer;letter-spacing:1px;
}
.top-menu-popup button:hover{background:rgba(224,169,74,.16);color:#ffe9b8}
#gameTitle{
  font-size:19px;font-weight:700;letter-spacing:3px;color:#f0dca6;
  text-shadow:0 2px 12px rgba(224,169,74,.35);text-align:center;
}

.btn{
  background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02)),
    linear-gradient(160deg,rgba(20,28,38,.4),rgba(10,15,22,.6));
  border:1px solid var(--line-2);
  color:var(--text-0);padding:8px 15px;border-radius:10px;font-size:13px;
  cursor:pointer;font-family:inherit;transition:.18s;letter-spacing:1px;
  box-shadow:var(--shadow-sm),inset 0 1px 0 rgba(255,255,255,.08);
  white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;
}
.btn svg{width:14px;height:14px;flex-shrink:0}
.btn:hover{
  background:linear-gradient(160deg,rgba(224,169,74,.2),rgba(224,169,74,.06)),
    linear-gradient(160deg,rgba(20,28,38,.4),rgba(10,15,22,.6));
  border-color:rgba(224,169,74,.55);color:#ffe9b8;
  box-shadow:0 4px 16px rgba(224,169,74,.28),inset 0 1px 0 rgba(255,255,255,.12);
}
.btn:active{transform:scale(.96)}
.btn.danger:hover{background:rgba(220,80,80,.22);border-color:rgba(220,80,80,.6);color:#ffcccc;
  box-shadow:0 4px 16px rgba(220,80,80,.28)}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.18)}
.btn.icon-only{padding:8px 10px}

.diff-picker{
  display:inline-flex;gap:0;border-radius:10px;overflow:hidden;
  background:rgba(0,0,0,.35);border:1px solid var(--line-2);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.4);
}
.diff-picker button{
  background:transparent;border:none;color:var(--text-2);
  padding:8px 14px;font-size:12.5px;cursor:pointer;
  font-family:inherit;letter-spacing:1.5px;transition:.18s;
}
.diff-picker button:hover{color:#e8d8b0;background:rgba(255,255,255,.04)}
.diff-picker button.active{
  color:#1f1a10;font-weight:800;
  background:linear-gradient(160deg,#ffdc8e,#d9a441);
  text-shadow:0 1px 0 rgba(255,255,255,.45);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 18px rgba(224,169,74,.5);
}

/* 状态行（分层字号） */
.status-row{display:flex;gap:10px;align-items:stretch;margin-bottom:14px}
.status{
  flex:1;text-align:center;padding:11px 14px;border-radius:12px;
  font-size:14px;
  background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
  border:1px solid var(--line);
  min-height:44px;display:flex;align-items:center;justify-content:center;
  letter-spacing:1px;color:var(--text-0);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  transition:background .3s,color .3s,border-color .3s,box-shadow .3s;
  font-variant-numeric:tabular-nums;
}
/* 分层：主要 16px 加粗 */
.status .main-info{font-size:16px;font-weight:700}
.status .sub-info{font-size:12px;color:var(--text-2);margin-top:3px;display:block}
.status.alert{
  background:linear-gradient(160deg,rgba(255,90,90,.22),rgba(255,90,90,.06));
  border-color:rgba(255,90,90,.55);color:#ffc0c0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 24px rgba(255,90,90,.25);
  animation:statusAlert 1.2s ease-in-out infinite;
}
@keyframes statusAlert{
  0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 12px rgba(255,90,90,.15)}
  50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 28px rgba(255,90,90,.5)}
}
.status.success{
  background:linear-gradient(160deg,rgba(90,230,140,.2),rgba(90,230,140,.05));
  border-color:rgba(90,230,140,.5);color:#c8ffe0;
}
.status.warn{
  background:linear-gradient(160deg,rgba(255,200,80,.2),rgba(255,200,80,.05));
  border-color:rgba(255,200,80,.5);color:#ffe4b0;
}
.pause-btn{
  width:52px;flex-shrink:0;border-radius:12px;
  background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));
  border:1px solid var(--line);
  color:var(--text-1);cursor:pointer;transition:.2s;
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);font-family:inherit;
}
.pause-btn svg{width:20px;height:20px}
.pause-btn:hover{
  background:linear-gradient(160deg,rgba(224,169,74,.2),rgba(224,169,74,.05));
  border-color:rgba(224,169,74,.5);color:var(--gold-0);
}
.pause-btn:active{transform:scale(.94)}

.timer-bar{
  width:74px;flex-shrink:0;border-radius:12px;
  background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));
  border:1px solid var(--line);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:2px;color:var(--text-0);
  transition:.2s;position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.timer-bar .timer-icon{font-size:13px;opacity:.7}
.timer-bar .timer-num{
  font-size:22px;font-weight:800;letter-spacing:1px;line-height:1;
  font-variant-numeric:tabular-nums;
}
.timer-bar.warn{
  border-color:rgba(255,90,90,.7);
  background:linear-gradient(160deg,rgba(255,90,90,.22),rgba(200,50,50,.08));
  color:#ffb3b3;
  animation:timerPulse 1s ease-in-out infinite;
}
@keyframes timerPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,90,90,.5)}
  50%{box-shadow:0 0 22px 5px rgba(255,90,90,.55)}
}
.timer-bar.hidden{display:none}
.timer-bar.stop{opacity:.35;filter:grayscale(.7)}

/* === 优化 15：计时器全屏边缘光 === */
body.timer-warning::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  box-shadow:inset 0 0 80px 20px rgba(255,60,60,.28),
             inset 0 0 160px 40px rgba(255,60,60,.12);
  animation:timerWarningPulse 1.2s ease-in-out infinite;
}
@keyframes timerWarningPulse{
  0%,100%{opacity:.55}
  50%{opacity:1}
}
/* === 优化 16：将军红色警示 === */
body.in-check::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:98;
  box-shadow:inset 0 0 70px 18px rgba(255,80,80,.45),
             inset 0 0 150px 40px rgba(255,80,80,.2);
  animation:checkFlash .55s ease-out 2;
}
@keyframes checkFlash{
  0%{opacity:0}
  30%{opacity:1}
  100%{opacity:.35}
}

.hint{
  text-align:center;color:var(--text-2);font-size:12px;margin-top:16px;
  line-height:1.9;padding:10px 14px;border-radius:10px;
  background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.05);
  transition:.2s;min-height:56px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.hint b{color:var(--gold-1)}
.board-wrap{
  display:flex;justify-content:center;align-items:flex-start;
  padding:8px;overflow:auto;min-height:120px;
}

/* === 棋盘"厚度"通用容器 === */
.board-stage{
  position:relative;
  padding-bottom:10px;
  perspective:900px;
}
.board-stage::before{
  content:"";position:absolute;
  left:6px;right:6px;bottom:0;top:10px;
  border-radius:12px;
  background:linear-gradient(180deg,#1a0e04,#0a0500);
  z-index:0;
  box-shadow:0 22px 44px rgba(0,0,0,.65);
}
.board-stage > *{
  position:relative;z-index:1;
}

/* ============================================================
   通用棋子
   ============================================================ */
.stone{
  border-radius:50%;width:82%;height:82%;
  box-shadow:
    var(--shadow-dx) var(--shadow-dy) 7px rgba(0,0,0,.6),
    inset 0 -1px 3px rgba(0,0,0,.3);
}
.stone.black{
  background:
    radial-gradient(circle at var(--light-from-x) var(--light-from-y),#8a8a8a 0%,#2d2d2d 35%,#0a0a0a 75%),
    radial-gradient(circle at 70% 75%,rgba(120,120,120,.3),transparent 50%);
  box-shadow:
    var(--shadow-dx) var(--shadow-dy) 7px rgba(0,0,0,.7),
    inset 0 -2px 4px rgba(0,0,0,.5),
    inset 0 2px 3px rgba(255,255,255,.14);
}
.stone.white{
  background:
    radial-gradient(circle at var(--light-from-x) var(--light-from-y),#fff 0%,#e4e9ee 40%,#b8c0c8 80%),
    radial-gradient(circle at 70% 75%,rgba(255,255,255,.5),transparent 55%);
  box-shadow:
    var(--shadow-dx) var(--shadow-dy) 7px rgba(0,0,0,.6),
    inset 0 -2px 4px rgba(150,160,170,.4),
    inset 0 2px 3px rgba(255,255,255,.95);
}

/* ============================================================
   五子棋 / 围棋
   ============================================================ */
.gomoku-grid{
  display:grid;
  width:min(92vw,530px);
  aspect-ratio:1/1;
  background:
    radial-gradient(circle at 22% 18%,rgba(255,255,255,.55),transparent 50%),
    radial-gradient(circle at 80% 85%,rgba(160,110,40,.22),transparent 55%),
    linear-gradient(160deg,#eccc88 0%,#d4a94f 50%,#c69b41 100%);
  border:3px solid #7c5a22;border-radius:10px;
  box-shadow:
    0 20px 44px rgba(0,0,0,.6),
    0 0 0 1px rgba(0,0,0,.4) inset,
    inset 0 3px 8px rgba(255,255,255,.4),
    inset 0 -3px 8px rgba(120,80,20,.3);
  overflow:hidden;
}
.gomoku-grid .cell{
  position:relative;display:flex;align-items:center;justify-content:center;
  box-shadow:
    inset -1px -1px 0 rgba(110,80,30,.55),
    inset 1px 1px 0 rgba(255,255,255,.14);
  cursor:pointer;transition:background .15s;
  min-width:0;min-height:0;
}
.gomoku-grid .cell::before{
  content:"";position:absolute;width:5px;height:5px;border-radius:50%;
  background:rgba(90,60,20,.55);
  box-shadow:0 1px 1px rgba(255,255,255,.25);
  pointer-events:none;
}
/* === 优化 2：星位标记 === */
.gomoku-grid .cell.star::before{
  width:9px;height:9px;
  background:radial-gradient(circle at 40% 35%,#3a2408,#150c02);
  box-shadow:
    0 1px 2px rgba(0,0,0,.6),
    inset 0 1px 1px rgba(255,220,150,.35),
    0 0 0 1px rgba(255,220,150,.15);
}
.gomoku-grid .cell:hover{background:rgba(255,255,255,.2)}
/* === 优化 11：最后一步改用四角三角标记 === */
.gomoku-grid .cell.last::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(315deg, transparent 60%, rgba(224,75,58,.9) 60%, rgba(224,75,58,.9) 75%, transparent 75%) top left,
    linear-gradient(225deg, transparent 60%, rgba(224,75,58,.9) 60%, rgba(224,75,58,.9) 75%, transparent 75%) top right,
    linear-gradient(135deg, transparent 60%, rgba(224,75,58,.9) 60%, rgba(224,75,58,.9) 75%, transparent 75%) bottom left,
    linear-gradient(45deg,  transparent 60%, rgba(224,75,58,.9) 60%, rgba(224,75,58,.9) 75%, transparent 75%) bottom right;
  background-size:26% 26%;
  background-repeat:no-repeat;
  filter:drop-shadow(0 0 6px rgba(224,75,58,.85));
  animation:lastPulse 1.5s ease-in-out infinite;
}
@keyframes lastPulse{
  0%,100%{opacity:.85}
  50%{opacity:1;filter:drop-shadow(0 0 10px rgba(224,75,58,1))}
}
.gomoku-grid .stone{width:86%;height:86%;transition:transform .2s,box-shadow .2s}
/* === 优化 8：棋子悬停抬起 === */
.gomoku-grid .cell:hover .stone{
  transform:translateY(-2px) scale(1.08);
  box-shadow:var(--shadow-dx) 6px 10px rgba(0,0,0,.55),
    inset 0 -1px 3px rgba(0,0,0,.3);
}

/* === 优化 3：象棋楚河汉界 === */
.xq-river{
  position:absolute;
  top:50%;left:0;right:0;
  height:0;pointer-events:none;z-index:5;
}
.xq-river span{
  position:absolute;top:-18px;
  font-family:"KaiTi","STKaiti","Kaiti SC",serif;
  font-size:clamp(14px,3.4vw,22px);
  font-weight:900;
  letter-spacing:clamp(10px,2.4vw,20px);
  color:rgba(120,80,30,.55);
  text-shadow:0 1px 0 rgba(255,255,255,.4);
  writing-mode:vertical-rl;
}
.xq-river .river-left{left:12%;}
.xq-river .river-right{right:12%;}

/* ============================================================
   黑白棋
   ============================================================ */
.ot-grid{
  display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  width:min(92vw,470px);aspect-ratio:1/1;border-radius:12px;overflow:hidden;
  border:5px solid #2a1f10;
  box-shadow:
    0 20px 44px rgba(0,0,0,.65),
    inset 0 0 80px rgba(0,0,0,.4),
    0 0 0 1px rgba(255,255,255,.08),
    inset 0 2px 0 rgba(255,255,255,.12);
  background:
    radial-gradient(circle at 30% 20%,rgba(255,255,255,.1),transparent 45%),
    linear-gradient(160deg,#358548,#235c33);
}
.ot-cell{
  position:relative;display:flex;align-items:center;justify-content:center;
  background:transparent;border:1px solid rgba(0,0,0,.32);
  cursor:pointer;transition:background .15s;
  min-width:0;min-height:0;
}
.ot-cell:hover{background:rgba(255,255,255,.1)}
.ot-stone{width:80%;height:80%;border-radius:50%;transform-style:preserve-3d}
.ot-stone.b{
  background:radial-gradient(circle at 33% 28%,#6f6f6f 0%,#242424 40%,#050505 78%),
    radial-gradient(circle at 70% 75%,rgba(100,100,100,.35),transparent 55%);
  box-shadow:
    var(--shadow-dx) var(--shadow-dy) 8px rgba(0,0,0,.7),
    inset 0 -2px 5px rgba(0,0,0,.5),
    inset 0 2px 3px rgba(255,255,255,.15);
}
.ot-stone.w{
  background:radial-gradient(circle at 33% 28%,#fff 0%,#e6ebf0 42%,#b8c0c8 82%),
    radial-gradient(circle at 70% 75%,rgba(255,255,255,.6),transparent 55%);
  box-shadow:
    var(--shadow-dx) var(--shadow-dy) 8px rgba(0,0,0,.6),
    inset 0 -2px 5px rgba(140,150,160,.4),
    inset 0 2px 3px rgba(255,255,255,.95);
}
.ot-cell.hint::after{
  content:"";position:absolute;width:28%;height:28%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.65),rgba(255,255,255,.25));
  box-shadow:0 0 12px rgba(255,255,255,.7);
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:.5;transform:scale(.9)}
  50%{opacity:1;transform:scale(1.1)}
}
.ot-cell:hover .ot-stone{transform:translateY(-2px) scale(1.06)}

/* ============================================================
   中国象棋
   ============================================================ */
.xq-grid{
  display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(10,1fr);
  width:min(92vw,460px);aspect-ratio:9/10;
  background:
    radial-gradient(circle at 25% 15%,rgba(255,255,255,.55),transparent 55%),
    radial-gradient(circle at 80% 90%,rgba(160,110,40,.2),transparent 55%),
    linear-gradient(160deg,#f0d9ac,#e0c288 55%,#d4b074);
  border:5px solid #6d4d1d;border-radius:10px;overflow:hidden;
  box-shadow:
    0 20px 44px rgba(0,0,0,.6),
    inset 0 0 50px rgba(140,100,40,.3),
    inset 0 2px 0 rgba(255,255,255,.35);
  position:relative;
}
.xq-cell{
  position:relative;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(110,80,32,.5);
  cursor:pointer;transition:background .15s;
  min-width:0;min-height:0;
}
.xq-cell:hover{background:rgba(255,255,255,.34)}
.xq-piece{
  width:88%;height:88%;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(13px,3.6vw,25px);font-weight:800;
  font-family:"KaiTi","STKaiti","Kaiti SC",serif;
  background:
    radial-gradient(circle at var(--light-from-x) var(--light-from-y),#fff 0%,#f7ecd4 55%,#ddc99e 100%);
  border:2px solid #8a6a36;
  box-shadow:
    var(--shadow-dx) var(--shadow-dy) 8px rgba(0,0,0,.45),
    inset 0 -2px 5px rgba(150,110,50,.28),
    inset 0 2px 4px rgba(255,255,255,.95);
  user-select:none;
  transition:transform .2s cubic-bezier(.2,.9,.3,1.2),box-shadow .2s;
  will-change:transform;
}
.xq-cell:hover .xq-piece{
  transform:translateY(-2px) scale(1.07);
  box-shadow:
    var(--shadow-dx) 8px 12px rgba(0,0,0,.5),
    inset 0 -2px 5px rgba(150,110,50,.28),
    inset 0 2px 4px rgba(255,255,255,.95);
}
.xq-piece.red{color:#c22a1f;border-color:#a84e38;text-shadow:0 1px 0 rgba(255,255,255,.75)}
.xq-piece.black{color:#181818;border-color:#565656;text-shadow:0 1px 0 rgba(255,255,255,.7)}
/* === 优化 9：选中呼吸光晕 === */
.xq-piece.sel{
  box-shadow:
    0 0 0 3px #e0a234,
    0 0 22px rgba(224,169,74,.9),
    0 3px 10px rgba(0,0,0,.5);
  animation:selectedBreath 2s ease-in-out infinite;
}
@keyframes selectedBreath{
  0%,100%{box-shadow:0 0 0 3px #e0a234,0 0 16px rgba(224,169,74,.7),0 3px 10px rgba(0,0,0,.5)}
  50%{box-shadow:0 0 0 3px #ffd45e,0 0 28px rgba(224,169,74,1),0 3px 10px rgba(0,0,0,.5)}
}
.xq-cell.target::after{
  content:"";position:absolute;width:28%;height:28%;border-radius:50%;
  background:radial-gradient(circle,rgba(70,210,130,.95),rgba(40,140,70,.75));
  box-shadow:0 0 14px rgba(40,210,100,.9);
  animation:pulse 1.4s ease-in-out infinite;
}
.xq-cell.cap::after{
  content:"";position:absolute;inset:7%;border-radius:50%;
  border:3px solid rgba(220,60,40,.9);
  box-shadow:0 0 12px rgba(220,60,40,.7),inset 0 0 8px rgba(220,60,40,.4);
  animation:pulse 1.4s ease-in-out infinite;
}
/* === 优化 10：吃子碎裂动画 === */
.xq-cell.capture-anim .xq-piece{animation:captureBreak .42s ease-out forwards}
@keyframes captureBreak{
  0%{transform:scale(1);opacity:1;filter:brightness(1)}
  40%{transform:scale(1.18);opacity:1;filter:brightness(1.6) hue-rotate(-15deg)}
  70%{transform:scale(.7) rotate(8deg);opacity:.55;filter:brightness(1.4) blur(1px)}
  100%{transform:scale(0) rotate(20deg);opacity:0;filter:brightness(1.8) blur(2px)}
}

/* ============================================================
   国际象棋
   ============================================================ */
.ch-grid{
  display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  width:min(92vw,470px);aspect-ratio:1/1;border-radius:10px;overflow:hidden;
  border:5px solid #2a1f10;
  box-shadow:
    0 20px 44px rgba(0,0,0,.65),
    inset 0 0 80px rgba(0,0,0,.22),
    0 0 0 1px rgba(255,255,255,.08),
    inset 0 2px 0 rgba(255,255,255,.12);
}
.ch-cell{
  position:relative;display:flex;align-items:center;justify-content:center;
  font-size:clamp(20px,6.6vw,44px);cursor:pointer;user-select:none;
  line-height:1;transition:background .15s,filter .15s;
  min-width:0;min-height:0;
}
.ch-cell.light{
  background:
    radial-gradient(circle at 30% 25%,rgba(255,255,255,.5),transparent 55%),
    linear-gradient(160deg,#f5e2c0,#ead2ab);
}
.ch-cell.dark{
  background:
    radial-gradient(circle at 30% 25%,rgba(255,255,255,.15),transparent 55%),
    linear-gradient(160deg,#b8875e,#a07850);
  color:#1e1e1e;
}
.ch-cell:hover{filter:brightness(1.09)}
.ch-cell .pc{
  position:relative;z-index:2;
  transition:transform .2s cubic-bezier(.2,.9,.3,1.2);
  will-change:transform;
}
.ch-cell:hover .pc{transform:translateY(-2px) scale(1.08)}
.ch-cell .pc.w{
  color:#fdfdfd;
  text-shadow:
    0 0 1.5px #2b2b2b,
    0 2px 3px rgba(0,0,0,.5),
    0 0 10px rgba(255,255,255,.4);
}
.ch-cell .pc.b{
  color:#181818;
  text-shadow:0 1px 1px rgba(255,255,255,.38),0 2px 3px rgba(0,0,0,.28);
}
.ch-cell.sel{
  background:linear-gradient(160deg,#f7d271,#e6b845);
  box-shadow:inset 0 0 0 3px #e0a234,inset 0 0 22px rgba(255,200,80,.55);
}
.ch-cell.target::after{
  content:"";position:absolute;width:30%;height:30%;border-radius:50%;
  background:radial-gradient(circle,rgba(70,210,120,.95),rgba(40,150,80,.75));
  box-shadow:0 0 14px rgba(40,210,100,.85);
  animation:pulse 1.4s ease-in-out infinite;
}
.ch-cell.cap::after{
  content:"";position:absolute;inset:6%;border-radius:50%;
  border:3px solid rgba(220,60,40,.9);
  box-shadow:0 0 12px rgba(220,60,40,.7),inset 0 0 8px rgba(220,60,40,.4);
  animation:pulse 1.4s ease-in-out infinite;
}
.ch-cell.last{
  box-shadow:inset 0 0 0 3px rgba(255,200,60,.9),inset 0 0 22px rgba(255,200,60,.4);
}
.ch-cell.capture-anim .pc{animation:captureBreak .42s ease-out forwards}
/* === 优化 4：国际象棋坐标 === */
.ch-coord{
  position:absolute;font-size:10px;font-weight:700;
  color:rgba(60,40,20,.45);pointer-events:none;user-select:none;
  font-family:ui-monospace,"SF Mono",monospace;
}
.ch-coord.file{bottom:2px;right:3px}
.ch-coord.rank{top:2px;left:3px}
.ch-cell.dark .ch-coord{color:rgba(255,240,220,.35)}

/* ============================================================
   军棋
   ============================================================ */
.jq-grid{
  display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);
  width:min(92vw,440px);aspect-ratio:1/1;gap:5px;padding:8px;
  background:
    radial-gradient(circle at 25% 15%,rgba(255,255,255,.12),transparent 55%),
    linear-gradient(160deg,#3d4a57,#1c242d);
  border:3px solid #4e5a67;border-radius:14px;
  box-shadow:
    0 20px 44px rgba(0,0,0,.65),
    inset 0 0 50px rgba(0,0,0,.5),
    inset 0 2px 0 rgba(255,255,255,.08);
}
.jq-cell{
  display:flex;align-items:center;justify-content:center;border-radius:9px;
  background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.015));
  cursor:pointer;position:relative;
  border:1px solid rgba(255,255,255,.08);transition:.2s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  min-width:0;min-height:0;
}
.jq-cell:hover{
  background:rgba(255,255,255,.14);
  transform:translateY(-1px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 4px 10px rgba(0,0,0,.35);
}
.jq-piece{
  width:100%;height:100%;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(11px,2.9vw,17px);font-weight:800;letter-spacing:0;
  font-family:"KaiTi","STKaiti",serif;user-select:none;
  transition:transform .2s cubic-bezier(.2,.9,.3,1.2);
  will-change:transform;
}
.jq-cell:hover .jq-piece{transform:translateY(-1px) scale(1.05)}
.jq-piece.side-r{
  background:linear-gradient(160deg,#e8604f,#a82a1e);color:#fff2e8;border:1px solid #ff9a86;
  box-shadow:
    0 3px 9px rgba(0,0,0,.55),
    inset 0 -2px 5px rgba(0,0,0,.28),
    inset 0 2px 4px rgba(255,180,160,.4);
  text-shadow:0 1px 2px rgba(0,0,0,.55);
}
.jq-piece.side-b{
  background:linear-gradient(160deg,#5578a0,#25405c);color:#e8f2ff;border:1px solid #7fa6cc;
  box-shadow:
    0 3px 9px rgba(0,0,0,.55),
    inset 0 -2px 5px rgba(0,0,0,.28),
    inset 0 2px 4px rgba(160,200,255,.35);
  text-shadow:0 1px 2px rgba(0,0,0,.55);
}
.jq-piece.sel{
  outline:3px solid #ffd45e;outline-offset:-2px;
  box-shadow:0 0 22px rgba(255,212,94,.9),0 3px 8px rgba(0,0,0,.45);
  animation:selectedBreath 2s ease-in-out infinite;
}
.jq-cell.target::after{
  content:"";position:absolute;width:32%;height:32%;border-radius:50%;
  background:radial-gradient(circle,rgba(90,230,140,.95),rgba(50,180,100,.75));
  box-shadow:0 0 14px rgba(90,230,140,.9);
  animation:pulse 1.4s ease-in-out infinite;
}

/* ============================================================
   国际跳棋
   ============================================================ */
.dr-grid{
  display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  width:min(92vw,470px);aspect-ratio:1/1;border-radius:10px;overflow:hidden;
  border:5px solid #2a1f10;
  box-shadow:
    0 20px 44px rgba(0,0,0,.65),
    inset 0 0 80px rgba(0,0,0,.25),
    0 0 0 1px rgba(255,255,255,.08),
    inset 0 2px 0 rgba(255,255,255,.12);
}
.dr-cell{
  position:relative;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:filter .15s;
  min-width:0;min-height:0;
}
.dr-cell.light{
  background:
    radial-gradient(circle at 30% 25%,rgba(255,255,255,.55),transparent 55%),
    linear-gradient(160deg,#f5e4c8,#ecd7b3);
  cursor:default;
}
.dr-cell.dark{
  background:
    radial-gradient(circle at 30% 25%,rgba(255,255,255,.12),transparent 55%),
    linear-gradient(160deg,#5a3d22,#432b16);
}
/* === 优化 5：升王区高亮 === */
.dr-cell.dark.king-zone::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,220,120,.25),rgba(255,220,120,.05));
  box-shadow:inset 0 0 10px rgba(255,220,120,.35);
}
.dr-cell.dark:hover{filter:brightness(1.15)}
.dr-piece{
  width:78%;height:78%;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  position:relative;
  transition:transform .2s cubic-bezier(.2,.9,.3,1.2);
  will-change:transform;
}
.dr-cell:hover .dr-piece{transform:translateY(-2px) scale(1.06)}
.dr-piece.red{
  background:
    radial-gradient(circle at 33% 26%,#ff8a78 0%,#c83820 45%,#7a1c08 100%),
    radial-gradient(circle at 70% 75%,rgba(255,140,110,.4),transparent 55%);
  border:2px solid #5a1206;
  box-shadow:
    var(--shadow-dx) var(--shadow-dy) 10px rgba(0,0,0,.65),
    inset 0 -3px 6px rgba(0,0,0,.4),
    inset 0 3px 5px rgba(255,200,180,.4);
}
.dr-piece.black{
  background:
    radial-gradient(circle at 33% 26%,#6a6a6a 0%,#1c1c1c 45%,#000 100%),
    radial-gradient(circle at 70% 75%,rgba(120,120,120,.35),transparent 55%);
  border:2px solid #000;
  box-shadow:
    var(--shadow-dx) var(--shadow-dy) 10px rgba(0,0,0,.7),
    inset 0 -3px 6px rgba(0,0,0,.55),
    inset 0 3px 5px rgba(255,255,255,.18);
}
.dr-piece.king::after{
  content:"♛";position:absolute;
  font-size:clamp(14px,4vw,24px);color:#ffd45e;
  text-shadow:0 0 6px rgba(255,212,94,.85),0 1px 2px rgba(0,0,0,.8);
  font-family:"Times New Roman",serif;
}
.dr-piece.sel{
  box-shadow:0 0 0 3px #ffd45e,0 0 22px rgba(255,212,94,.9),0 4px 10px rgba(0,0,0,.5);
  animation:selectedBreath 2s ease-in-out infinite;
}
.dr-cell.target::after{
  content:"";position:absolute;width:30%;height:30%;border-radius:50%;
  background:radial-gradient(circle,rgba(70,210,120,.95),rgba(40,150,80,.75));
  box-shadow:0 0 14px rgba(40,210,100,.85);
  animation:pulse 1.4s ease-in-out infinite;
}
.dr-cell.cap::after{
  content:"";position:absolute;inset:8%;border-radius:50%;
  border:3px solid rgba(220,60,40,.9);
  box-shadow:0 0 12px rgba(220,60,40,.7),inset 0 0 8px rgba(220,60,40,.4);
  animation:pulse 1.4s ease-in-out infinite;
}
.dr-cell.last{
  box-shadow:inset 0 0 0 3px rgba(255,200,60,.9),inset 0 0 22px rgba(255,200,60,.45);
}

/* ============================================================
   四子棋
   ============================================================ */
.c4-wrap{display:flex;justify-content:center;position:relative}
.c4-grid{
  display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);
  width:min(92vw,520px);aspect-ratio:7/6;
  gap:clamp(4px,1.1vw,8px);padding:clamp(8px,1.6vw,12px);
  background:
    radial-gradient(circle at 25% 15%,rgba(255,255,255,.18),transparent 55%),
    radial-gradient(circle at 80% 90%,rgba(0,0,0,.35),transparent 60%),
    linear-gradient(160deg,#2a5c9c 0%,#1a3c6c 55%,#102a52 100%);
  border:5px solid #0b1d3a;border-radius:14px;
  box-shadow:
    0 20px 44px rgba(0,0,0,.65),
    0 0 0 1px rgba(255,255,255,.08) inset,
    inset 0 3px 0 rgba(255,255,255,.16);
}
.c4-cell{
  position:relative;border-radius:50%;
  background:radial-gradient(circle at 50% 40%,#050c1c 0%,#020610 65%,#000 100%);
  box-shadow:
    inset 0 6px 12px rgba(0,0,0,.85),
    inset 0 -3px 6px rgba(255,255,255,.05),
    0 2px 4px rgba(255,255,255,.06);
  cursor:pointer;transition:background .15s;
  min-width:0;min-height:0;
}
.c4-cell.hover{
  background:radial-gradient(circle at 50% 40%,#0f1a30 0%,#050c1c 65%,#000 100%);
}
/* === 优化 6：四子棋落子预览 === */
.c4-cell.preview::after{
  content:"";position:absolute;inset:8%;border-radius:50%;
  background:
    radial-gradient(circle at 35% 28%,rgba(255,156,138,.55),rgba(232,56,32,.35) 60%,rgba(148,22,6,.25) 100%);
  border:2px solid rgba(255,150,120,.6);
  box-shadow:0 0 18px rgba(232,80,50,.55),inset 0 -2px 6px rgba(0,0,0,.4);
  animation:previewPulse 1.4s ease-in-out infinite;
  pointer-events:none;
}
@keyframes previewPulse{
  0%,100%{opacity:.55;transform:scale(.94)}
  50%{opacity:.9;transform:scale(1)}
}
.c4-cell.col-full{cursor:not-allowed}
.c4-piece{position:absolute;inset:0;border-radius:50%;z-index:2}
.c4-piece.anim{animation:c4Drop .42s cubic-bezier(.35,1.1,.55,1)}
@keyframes c4Drop{
  0%{transform:translateY(-260%) scale(1.06);opacity:.7}
  70%{transform:translateY(6%) scale(.98);opacity:1}
  85%{transform:translateY(-2%) scale(1.01)}
  100%{transform:translateY(0) scale(1);opacity:1}
}
.c4-piece.red{
  background:
    radial-gradient(circle at 35% 28%,#ff9c8a 0%,#e83820 45%,#941606 100%),
    radial-gradient(circle at 70% 75%,rgba(255,160,130,.4),transparent 55%);
  box-shadow:
    var(--shadow-dx) var(--shadow-dy) 10px rgba(0,0,0,.6),
    inset 0 -3px 6px rgba(0,0,0,.4),
    inset 0 3px 5px rgba(255,200,180,.4);
}
.c4-piece.yellow{
  background:
    radial-gradient(circle at 35% 28%,#fff2a0 0%,#ffc21a 45%,#a87500 100%),
    radial-gradient(circle at 70% 75%,rgba(255,240,180,.45),transparent 55%);
  box-shadow:
    var(--shadow-dx) var(--shadow-dy) 10px rgba(0,0,0,.6),
    inset 0 -3px 6px rgba(120,80,0,.4),
    inset 0 3px 5px rgba(255,255,220,.55);
}
.c4-cell.win-cell{
  box-shadow:
    inset 0 6px 12px rgba(0,0,0,.85),
    inset 0 -3px 6px rgba(255,255,255,.05),
    0 0 0 3px #ffe45e,
    0 0 18px rgba(255,228,94,.85);
}
.c4-cell.win-cell .c4-piece{filter:drop-shadow(0 0 12px rgba(255,228,94,.85))}

/* ============================================================
   通用动画
   ============================================================ */
@keyframes dropIn{
  0%{transform:translateY(-52px) scale(.5);opacity:0}
  55%{transform:translateY(5px) scale(1.14);opacity:1}
  78%{transform:translateY(-2px) scale(.97)}
  100%{transform:translateY(0) scale(1);opacity:1}
}
@keyframes fadeScale{
  0%{opacity:0;transform:scale(.5)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes flipIn{
  0%{transform:rotateY(0deg) scale(1)}
  45%{transform:rotateY(90deg) scale(.9)}
  55%{transform:rotateY(90deg) scale(.9)}
  100%{transform:rotateY(0deg) scale(1)}
}
@keyframes slideIn{
  0%{opacity:0;transform:translateY(-30px) scale(.85)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes fadeInOverlay{from{opacity:0}to{opacity:1}}
@keyframes modalPop{
  from{opacity:0;transform:scale(.92) translateY(8px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
.anim-drop{animation:dropIn .42s cubic-bezier(.22,1.15,.5,1)}
.anim-fade{animation:fadeScale .28s cubic-bezier(.3,1.2,.5,1)}
.anim-flip{animation:flipIn .46s ease-out}
.anim-slide{animation:slideIn .32s cubic-bezier(.3,1.1,.5,1)}

/* === 优化 22：落子影子落地 === */
.shadow-pulse{
  position:absolute;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.5),transparent 70%);
  transform:scale(0);
  animation:shadowPulse .42s cubic-bezier(.3,.7,.4,1) forwards;
}
@keyframes shadowPulse{
  0%{transform:scale(.4);opacity:0}
  30%{transform:scale(1.1);opacity:.75}
  70%{transform:scale(.95);opacity:.5}
  100%{transform:scale(1);opacity:.35}
}

/* 省电模式 */
body.power-save *{
  animation-duration:0s !important;
  animation-iteration-count:1 !important;
  transition-duration:0s !important;
}
body.power-save::before{animation:none}
body.power-save .pause-overlay,
body.power-save .modal-overlay{backdrop-filter:none;-webkit-backdrop-filter:none}

/* ============================================================
   棋子提示条
   ============================================================ */
.piece-tip{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
.piece-tip .glyph{font-size:22px;line-height:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.55))}
.piece-tip .desc{
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:13px;color:#eadcbe;letter-spacing:.5px;
}
.piece-tip .desc b{color:var(--gold-0)}
.piece-tip .dyn{margin-top:6px;font-size:12px;color:#a8bdd0;letter-spacing:.5px}
.piece-tip .dyn .good{color:#7be0a5}
.piece-tip .dyn .bad{color:#ef8a8a}
.piece-tip .dyn .warn{color:#ffd987}

/* ============================================================
   模态框
   ============================================================ */
.modal-overlay{
  position:fixed;inset:0;z-index:1000;background:rgba(5,8,13,.8);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fadeInOverlay .2s ease-out;
}
.modal{
  width:100%;max-width:440px;padding:24px;border-radius:18px;
  background:linear-gradient(160deg,#233240,#101820);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:
    0 30px 70px rgba(0,0,0,.75),
    inset 0 0 0 1px rgba(224,169,74,.12),
    inset 0 1px 0 rgba(255,255,255,.08);
  animation:modalPop .24s cubic-bezier(.2,1.2,.4,1);
  max-height:90vh;overflow-y:auto;
}
.modal-title{font-size:17px;font-weight:800;letter-spacing:2px;color:var(--gold-0);margin-bottom:10px}
.modal-body{font-size:13.5px;color:var(--text-1);line-height:1.8;letter-spacing:.5px;margin-bottom:20px}
.modal-body label{user-select:none}
.modal-body .switch-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;gap:12px}
.modal-body .switch-row .sub-desc{font-size:11px;color:var(--text-3);margin-top:3px;letter-spacing:.3px}
.modal-body .switch-row > div{flex:1;min-width:0}
.modal-body input[type="checkbox"]{
  width:20px;height:20px;accent-color:var(--gold-1);cursor:pointer;vertical-align:middle;flex-shrink:0;
}
.modal-body select{
  padding:6px 12px;border-radius:8px;background:#1a2530;color:#fff;
  border:1px solid rgba(255,255,255,.18);font-family:inherit;font-size:13px;cursor:pointer;
}
.modal-body .sound-test{
  margin-top:8px;padding:8px 12px;font-size:12px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;
  color:var(--text-1);cursor:pointer;font-family:inherit;width:100%;
}
.modal-body .sound-test:hover{background:rgba(224,169,74,.15);border-color:rgba(224,169,74,.4);color:#ffe9b8}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}

/* 玩法速览 */
.howto-body{display:flex;flex-direction:column;gap:10px}
.howto-step{
  display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);
}
.howto-step .num{
  flex-shrink:0;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:800;
  background:linear-gradient(160deg,#ffdc8e,#d9a441);color:#1f1a10;
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.howto-step .txt{flex:1;font-size:13px;line-height:1.55;color:#e8e0c8}
.howto-step .txt b{color:var(--gold-0)}
.howto-foot{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--text-2)}
.howto-foot label{display:flex;align-items:center;gap:6px;cursor:pointer}
.howto-foot input{accent-color:var(--gold-1);cursor:pointer}

/* 规则面板 */
.rules-body{font-size:13px;line-height:1.9;color:var(--text-1)}
.rules-body h4{margin:12px 0 6px;color:var(--gold-0);font-size:13px;letter-spacing:1px;font-weight:700}
.rules-body h4:first-child{margin-top:0}
.rules-body ul{margin:0;padding-left:22px}
.rules-body li{margin:3px 0}
.rules-body li b{color:#ffe0a0}
.rules-body .divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);margin:12px 0}
.rules-body .side-note{font-size:12px;color:var(--text-2);margin-top:10px}

.diff-desc{
  margin:8px 0 0;font-size:11.5px;color:var(--text-2);text-align:center;letter-spacing:1px;
  min-height:16px;transition:.2s;
}
.diff-desc.easy{color:#8fe0aa}
.diff-desc.mid{color:#ffd987}
.diff-desc.hard{color:#ff9a9a}

/* 暂停遮罩 === 优化 25：毛玻璃呼吸 === */
.pause-overlay{
  position:fixed;inset:0;z-index:900;
  background:rgba(5,8,13,.78);
  backdrop-filter:blur(10px) saturate(1.1);
  -webkit-backdrop-filter:blur(10px) saturate(1.1);
  display:flex;align-items:center;justify-content:center;padding:24px;
  animation:fadeInOverlay .2s ease-out;
}
.pause-overlay .pause-card{
  width:100%;max-width:340px;padding:28px 24px;text-align:center;border-radius:20px;
  background:linear-gradient(160deg,rgba(30,42,56,.95),rgba(15,22,30,.98));
  border:1px solid rgba(255,255,255,.1);
  box-shadow:
    0 30px 80px rgba(0,0,0,.75),
    inset 0 1px 0 rgba(255,255,255,.08);
  animation:modalPop .28s cubic-bezier(.2,1.2,.4,1);
}
/* 暂停时背景棋盘的"凝固"效果 */
body.paused #boardWrap{animation:pausedBoardBreath 4s ease-in-out infinite}
@keyframes pausedBoardBreath{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.02)}
}
.pause-overlay .pause-icon{
  font-size:52px;line-height:1;margin-bottom:12px;
  filter:drop-shadow(0 4px 12px rgba(224,169,74,.5));
}
.pause-overlay .pause-title{
  font-size:19px;font-weight:800;letter-spacing:3px;color:var(--gold-0);margin-bottom:8px;
}
.pause-overlay .pause-desc{font-size:12.5px;color:var(--text-2);letter-spacing:1px;margin-bottom:8px}
.pause-overlay .pause-stats{
  font-size:12px;color:var(--text-1);letter-spacing:1px;margin-bottom:20px;
  padding:10px;border-radius:8px;background:rgba(255,255,255,.04);
  border:1px solid var(--line);font-variant-numeric:tabular-nums;
}
.pause-overlay .btn{
  width:100%;padding:12px;font-size:14px;letter-spacing:2px;
  background:linear-gradient(160deg,#ffdc8e,#d9a441);color:#1f1a10;font-weight:800;border:none;
  box-shadow:0 4px 18px rgba(224,169,74,.4);
}
.pause-overlay .btn:hover{background:linear-gradient(160deg,#ffe9a8,#e0a94a);color:#1f1a10}

/* === 优化 23：胜利彩带/粒子 === */
.victory-particles{
  position:fixed;inset:0;pointer-events:none;z-index:950;overflow:hidden;
}
.victory-particles .p{
  position:absolute;width:8px;height:8px;border-radius:2px;
  animation:vicFall 2s ease-out forwards;
  opacity:.95;
}
@keyframes vicFall{
  0%{transform:translateY(-100vh) rotate(0);opacity:0}
  10%{opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}

/* 棋谱记录 === 优化 19：对齐美化 === */
.move-log{
  max-height:120px;overflow-y:auto;margin-top:12px;padding:10px 14px;border-radius:10px;
  background:rgba(0,0,0,.25);border:1px solid var(--line);
  font-family:ui-monospace,"SF Mono",monospace;font-size:11.5px;color:var(--text-1);line-height:1.7;
}
.move-log::-webkit-scrollbar{width:6px}
.move-log::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
.move-log .log-title{
  color:var(--gold-0);font-weight:700;letter-spacing:2px;margin-bottom:6px;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11px;
}
.move-log .log-line{
  display:grid;grid-template-columns:34px 1fr 1fr;gap:6px;
  align-items:baseline;
}
.move-log .log-line .num{
  color:var(--text-3);text-align:right;
  font-variant-numeric:tabular-nums;
}
.move-log .log-line .red-mv{color:#ffc8b8}
.move-log .log-line .blk-mv{color:#b8d8ff}
.move-log .log-empty{
  color:var(--text-3);font-family:"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:1px;
}

<script>
/* ============================================================
 *  下棋天地 · 离线版 v9
 *  视觉全面升级：星位 / 坐标 / 厚度 / 粒子 / 折叠 / 大字号
 * ============================================================ */

const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt != null) e.textContent = txt;
  return e;
};
/* SVG 图标构造器 */
function icon(name){
  const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
  const u = document.createElementNS('http://www.w3.org/2000/svg','use');
  u.setAttributeNS('http://www.w3.org/1999/xlink','href','#icon-' + name);
  u.setAttribute('href','#icon-' + name);
  s.appendChild(u);
  return s;
}
/* 里程碑图标名映射 */
const MS_ICON_MAP = {
  '🕐':'ms-clock','⏰':'ms-clock','🕰️':'ms-clock','⌛':'ms-hourglass','🌟':'ms-star','💎':'ms-gem',
  '🎯':'ms-target','🎮':'ms-target','🎲':'ms-target','🏅':'ms-medal','🏆':'ms-trophy2',
  '👑':'ms-crown','🎖️':'ms-medal','✨':'ms-star','⚔️':'ms-sword','🗡️':'ms-sword','🏹':'ms-target',
  '🛡️':'ms-shield','👊':'ms-sword','🐉':'ms-fire','🔥':'ms-fire','⚡':'ms-bolt','💫':'ms-star',
  '🌠':'ms-star','🌌':'ms-star','🌱':'ms-paw','🌿':'ms-paw','🌳':'ms-paw','💥':'ms-bolt',

function emptyStats(){
  return {
    win:0, lose:0, draw:0, abandon:0,
    totalGames:0, totalTimeMs:0, longestGameMs:0, fastestWinMs:null,
    currentStreak:0, bestStreak:0, noAbandonStreak:0,
    winsByDiff:{easy:0,mid:0,hard:0},
    gamesByGame:{gomoku:0,go:0,xiangqi:0,chess:0,junqi:0,othello:0,draughts:0,connect4:0},
    winsByGame:{gomoku:0,go:0,xiangqi:0,chess:0,junqi:0,othello:0,draughts:0,connect4:0},
    unlocked:{}, lastResult:null
  };
}
function loadRecords(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return { records: [], score: 0, stats: emptyStats() };
    let d;
    try { d = JSON.parse(raw); } catch(parseErr){ return { records: [], score: 0, stats: emptyStats() }; }
    if (!d || typeof d !== 'object') d = {};
    const def = emptyStats();
    d.records = Array.isArray(d.records) ? d.records : [];
    d.records = d.records.filter(r => r && typeof r === 'object' && r.time && r.game);
    d.score = (typeof d.score === 'number' && isFinite(d.score)) ? d.score : 0;
    const incoming = (d.stats && typeof d.stats === 'object') ? d.stats : {};
    d.stats = Object.assign(def, incoming);
    ['win','lose','draw','abandon','totalGames','totalTimeMs','longestGameMs',
     'currentStreak','bestStreak','noAbandonStreak'].forEach(k => {
      if (typeof d.stats[k] !== 'number' || !isFinite(d.stats[k])) d.stats[k] = 0;
    });
    d.stats.fastestWinMs = (typeof d.stats.fastestWinMs === 'number' && isFinite(d.stats.fastestWinMs))
      ? d.stats.fastestWinMs : null;
    d.stats.winsByDiff = Object.assign({ easy:0, mid:0, hard:0 },
      d.stats.winsByDiff && typeof d.stats.winsByDiff === 'object' ? d.stats.winsByDiff : {});
    ['easy','mid','hard'].forEach(k => {
      if (typeof d.stats.winsByDiff[k] !== 'number') d.stats.winsByDiff[k] = 0;
    });
    const base = { gomoku:0, go:0, xiangqi:0, chess:0, junqi:0, othello:0, draughts:0, connect4:0 };
    d.stats.gamesByGame = Object.assign({}, base,
      d.stats.gamesByGame && typeof d.stats.gamesByGame === 'object' ? d.stats.gamesByGame : {});
    d.stats.winsByGame = Object.assign({}, base,
      d.stats.winsByGame && typeof d.stats.winsByGame === 'object' ? d.stats.winsByGame : {});
    d.stats.unlocked = (d.stats.unlocked && typeof d.stats.unlocked === 'object') ? d.stats.unlocked : {};
    return d;
  }catch(e){
    return { records: [], score: 0, stats: emptyStats() };
  }
}
function saveRecords(data){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); return true; }
  catch(e){ return false; }
}
function getDifficulty(){

function loadSettings(){

    const merged = Object.assign({}, DEFAULT_SETTINGS, d || {});
    if (typeof merged.soundVolume !== 'number' || merged.soundVolume < 0 || merged.soundVolume > 1) merged.soundVolume = 0.6;
    if (typeof merged.timerSeconds !== 'number' || merged.timerSeconds < 5) merged.timerSeconds = 30;
    return merged;
  }catch(e){ return Object.assign({}, DEFAULT_SETTINGS); }
}

function formatTime(date){
  const p = n => String(n).padStart(2,'0');
  return date.getFullYear() + '-' + p(date.getMonth()+1) + '-' + p(date.getDate()) +
         ' ' + p(date.getHours()) + ':' + p(date.getMinutes()) + ':' + p(date.getSeconds());
}
function formatDuration(ms){
  if (ms < 1000) return '0 秒';
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + ' 秒';
  const m = Math.floor(s / 60);
  if (m < 60) return m + ' 分 ' + (s % 60) + ' 秒';
  const h = Math.floor(m / 60);
  return h + ' 小时 ' + (m % 60) + ' 分';
}
function formatDurationShort(ms){
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm';
  return Math.floor(m / 60) + 'h';
}

function saveAutoState(gameKey, data){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({ gameKey, data, time: Date.now() })); }
  catch(e){}
}
function loadAutoState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (Date.now() - d.time > 72 * 3600 * 1000){ localStorage.removeItem(SAVE_KEY); return null; }
    return d;
  }catch(e){ return null; }
}
function clearAutoState(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

 *  棋谱记录
 * ============================================================ */
let moveLogEntries = [];
let moveLogLineNo = 0;
function resetMoveLog(){
  moveLogEntries = [];
  moveLogLineNo = 0;
  renderMoveLog();
  renderSideMoveLog();
}
function addMoveLog(side, text){
  moveLogEntries.push({ side, text });
  if (moveLogEntries.length > 200) moveLogEntries.shift();
  renderMoveLog();
  renderSideMoveLog();
}
function buildMoveLogLines(){
  const lines = [];
  let cur = null;
  moveLogEntries.forEach(e => {
    if (e.side === 'red'){
      if (cur){ lines.push(cur); cur = null; }
      cur = { red: e.text, black: '' };
    } else {
      if (cur && !cur.black){ cur.black = e.text; lines.push(cur); cur = null; }
      else { lines.push({ red: '', black: e.text }); }
    }
  });
  if (cur) lines.push(cur);
  return lines;
}
function renderMoveLog(){
  const box = $('moveLog');
  if (!box) return;
  if (!loadSettings().moveLogEnabled){ box.style.display = 'none'; return; }
  box.style.display = '';
  box.innerHTML = '';
  const title = el('div','log-title','最近着法');
  box.appendChild(title);
  if (!moveLogEntries.length){
    box.appendChild(el('div','log-empty','暂无着法，先下一手吧'));
    return;
  }
  const lines = buildMoveLogLines();
  const lastShow = lines.slice(-8);
  const startNo = moveLogLineNo + lines.length - lastShow.length + 1;
  lastShow.forEach((line, i) => {
    const row = el('div','log-line');
    row.innerHTML =
      '<span class="num">' + (startNo + i) + '.</span>' +
      '<span class="red-mv">' + (line.red || '…') + '</span>' +
      '<span class="blk-mv">' + (line.black || '…') + '</span>';
    box.appendChild(row);
  });
  box.scrollTop = box.scrollHeight;
}
function renderSideMoveLog(){
  const box = $('sideMoveLog');
  if (!box) return;
  box.innerHTML = '';
  if (!moveLogEntries.length){
    box.innerHTML = '<div style="color:var(--text-3);font-size:11px">暂无着法</div>';
    return;
  }
  const lines = buildMoveLogLines();
  const lastShow = lines.slice(-14);
  lastShow.forEach((line, i) => {
    const row = el('div');
    row.style.cssText = 'display:grid;grid-template-columns:30px 1fr 1fr;gap:6px;';
    row.innerHTML =
      '<span style="color:var(--text-3);text-align:right">' + (i+1) + '.</span>' +
      '<span style="color:#ffc8b8">' + (line.red || '…') + '</span>' +
      '<span style="color:#b8d8ff">' + (line.black || '…') + '</span>';
    box.appendChild(row);
  });
  box.scrollTop = box.scrollHeight;
}
function setMoveLogBaseNo(n){ moveLogLineNo = n; }

const RESULT_LABEL = { win:'胜', lose:'负', draw:'平', abandon:'放弃' };
function renderRecordPreview(){
  const data = loadRecords();
  const s = data.stats;
  const total = data.records.length;
  const el1 = $('recordsPreview');
  if (el1) el1.textContent = total ? '共 ' + total + ' 条 · 总分 ' + data.score : '暂无记录';
  const el2 = $('milestonePreview');
  if (el2){
    const un = Object.keys(s.unlocked).length;
    el2.textContent = '已解锁 ' + un + ' / ' + MILESTONES.length;
  }
}
function renderRecordPanel(){
  const panel = $('recordPanel');
  panel.innerHTML = '';
  const data = loadRecords();
  const stats = data.stats;
  const section = el('div','panel');
  const h = el('h2');
  h.innerHTML = '我的对局记录';
  h.appendChild(el('span','panel-count', '共 ' + data.records.length + ' 条'));
  section.appendChild(h);
  const statsRow = el('div','stats-row');
  const boxes = [
    { k:'总分',   v:data.score,                            cls:'score' },
    { k:'总时长', v:formatDurationShort(stats.totalTimeMs), cls:'time' },
    { k:'胜',     v:stats.win || 0,                        cls:'win' },
    { k:'负',     v:stats.lose || 0,                       cls:'lose' },
    { k:'平',     v:stats.draw || 0,                       cls:'draw' },
    { k:'放弃',   v:stats.abandon || 0,                    cls:'abandon' }
  ];
  boxes.forEach(b => {
    const box = el('div','stat-box ' + b.cls);
    box.innerHTML = '<div class="k">' + b.k + '</div><div class="v">' + b.v + '</div>';
    statsRow.appendChild(box);
  });
  section.appendChild(statsRow);
  const list = el('div','records-list');
  if (!data.records.length){
    list.appendChild(el('div','records-empty',
      '还没有对局记录<br>快去大厅选择一种棋开始吧～'));
  } else {
    data.records.slice(0, 100).forEach(r => {
      const row = el('div','record-row');
      row.appendChild(el('div','time', r.time));
      row.appendChild(el('div','game', r.game));
      row.appendChild(el('div','diff ' + (r.diff || 'mid'), r.diffLabel || '适中'));
      row.appendChild(el('div','result ' + r.result,
        (RESULT_LABEL[r.result] || '?') + '  ' + (r.delta > 0 ? '+' : '') + r.delta));
      list.appendChild(row);
    });
  }
  section.appendChild(list);
  const foot = el('div','panel-foot');
  foot.appendChild(el('div', null,
    '最长单局 ' + formatDurationShort(stats.longestGameMs) +
    ' · 最高连胜 ' + (stats.bestStreak || 0)));
  const clearBtn = el('button','btn','清空记录');
  clearBtn.onclick = function(){
    showModal({
      title:'清空全部记录？',
      body:'此操作将删除所有对局历史、分数、成就进度，且不可恢复。',
      okText:'确认清空', cancelText:'取消', danger:true,
      onOk(){
        saveRecords({ records: [], score: 0, stats: emptyStats() });
        renderRecordPanel(); renderMilestonePanel(); renderRecordPreview();
      }
    });
  };
  foot.appendChild(clearBtn);
  section.appendChild(foot);
  panel.appendChild(section);
}

function milestoneProgress(m, stats){
  try{
    const p = m.progress ? m.progress(stats) : (m.check(stats) ? 1 : 0);
    if (typeof p !== 'number' || !isFinite(p)) return 0;
    return Math.max(0, Math.min(1, p));
  }catch(e){ return 0; }
}
function checkMilestones(data){
  const stats = data.stats;
  const unlocked = [];
  MILESTONES.forEach(m => {
    if (!stats.unlocked[m.id]){
      let ok = false;
      try{ ok = m.check(stats); }catch(e){ ok = false; }
      if (ok){ stats.unlocked[m.id] = Date.now(); unlocked.push(m); }
    }
  });
  if (unlocked.length) saveRecords(data);
  return unlocked;
}

let modalCallback = null;
function showModal(opts){
  opts = opts || {};
  $('modalTitle').textContent = opts.title || '提示';

  if (opts.bodyNode){ bodyEl.appendChild(opts.bodyNode); }

  $('modalCancel').textContent = opts.cancelText || '取消';
  $('modalCancel').style.display = opts.hideCancel ? 'none' : '';

  $('modalOverlay').classList.remove('hidden');
}
function closeModal(confirmed){
  $('modalOverlay').classList.add('hidden');
  const cb = modalCallback;
  modalCallback = null;
  if (cb){
    if (confirmed && cb.onOk) cb.onOk();
    if (!confirmed && cb.onCancel) cb.onCancel();
  }
}
$('modalOk').onclick = () => closeModal(true);
$('modalCancel').onclick = () => closeModal(false);
$('modalOverlay').addEventListener('click', e => {
  if (e.target === $('modalOverlay')) closeModal(false);
});

/* ============================================================
 *  音效
 * ============================================================ */
let audioCtx = null;
function ensureAudio(){
  if (!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ audioCtx = null; }
  }
  return audioCtx;
}
function playSound(type){
  const s = loadSettings();
  if (!s.soundEnabled) return;
  const ctx = ensureAudio();
  if (!ctx) return;
  const volume = Math.max(0, Math.min(1, s.soundVolume || 0.6));
  if (volume <= 0) return;
  try{
    const t = ctx.currentTime;
    if (type === 'place'){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.type = 'sine';
      o.frequency.setValueAtTime(560, t);
      o.frequency.exponentialRampToValueAtTime(280, t + 0.09);
      g.gain.setValueAtTime(0.12 * volume, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
      o.start(t); o.stop(t + 0.15);
    } else if (type === 'capture'){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.type = 'sawtooth';
      o.frequency.setValueAtTime(200, t);
      o.frequency.exponentialRampToValueAtTime(70, t + 0.16);
      g.gain.setValueAtTime(0.16 * volume, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      o.start(t); o.stop(t + 0.22);
    } else if (type === 'win'){
      [523, 659, 784, 1047].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination); o.type = 'sine';
        o.frequency.value = f;
        g.gain.setValueAtTime(0.11 * volume, t + i * 0.09);
        g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.09 + 0.2);
        o.start(t + i * 0.09); o.stop(t + i * 0.09 + 0.22);
      });
    } else if (type === 'lose'){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.type = 'sine';
      o.frequency.setValueAtTime(400, t);
      o.frequency.exponentialRampToValueAtTime(140, t + 0.5);
      g.gain.setValueAtTime(0.13 * volume, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
      o.start(t); o.stop(t + 0.6);
    } else if (type === 'tick'){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.type = 'sine';
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.07 * volume, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
      o.start(t); o.stop(t + 0.08);
    } else if (type === 'milestone'){
      [660, 880, 1174].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination); o.type = 'triangle';
        o.frequency.value = f;
        g.gain.setValueAtTime(0.12 * volume, t + i * 0.11);
        g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.11 + 0.25);
        o.start(t + i * 0.11); o.stop(t + i * 0.11 + 0.28);
      });
    } else if (type === 'pause'){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.type = 'sine';
      o.frequency.setValueAtTime(440, t);
      o.frequency.exponentialRampToValueAtTime(220, t + 0.15);
      g.gain.setValueAtTime(0.1 * volume, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      o.start(t); o.stop(t + 0.2);
    } else if (type === 'alert'){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.type = 'square';
      o.frequency.setValueAtTime(660, t);
      o.frequency.exponentialRampToValueAtTime(440, t + 0.15);
      g.gain.setValueAtTime(0.12 * volume, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      o.start(t); o.stop(t + 0.24);
    }
  }catch(e){}
}

function applyKeyframe(elem, animClass, duration){
  if (!elem) return;
  if (loadSettings().powerSave) return;
  elem.classList.remove(animClass);
  void elem.offsetWidth;
  elem.classList.add(animClass);
  setTimeout(() => { elem.classList.remove(animClass); }, duration || 420);

function flipMove(fromRect, pieceEl, duration){
  if (!fromRect || !pieceEl) return;
  if (loadSettings().powerSave) return;
  duration = duration || 300;
  const toRect = pieceEl.getBoundingClientRect();
  const dx = fromRect.left - toRect.left;
  const dy = fromRect.top - toRect.top;
  if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
  pieceEl.style.transition = 'none';
  pieceEl.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
  void pieceEl.offsetWidth;
  pieceEl.style.transition = 'transform ' + duration + 'ms cubic-bezier(.25,.9,.35,1)';
  pieceEl.style.transform = 'translate(0,0)';
  setTimeout(() => {
    if (pieceEl){ pieceEl.style.transition = ''; pieceEl.style.transform = ''; }
  }, duration + 30);
}

/* ============================================================
 *  回合限时器
 * ============================================================ */
function makeTurnTimer(ui, onTimeout){
  let remaining = 30;
  let intervalId = null;
  let running = false;
  let lastTickSecond = -1;
  function getDuration(){
    const s = loadSettings();
    return s.timerEnabled ? Math.max(5, s.timerSeconds || 30) : 0;
  }
  function paint(){
    const sec = Math.max(0, remaining);
    const dur = getDuration();
    const warn = remaining <= Math.min(10, Math.ceil(dur / 3)) && remaining > 0;
    ui.timer(sec, warn);
    // === 优化 15：全屏边缘光 ===
    document.body.classList.toggle('timer-warning', warn);
    if (warn && remaining !== lastTickSecond){
      lastTickSecond = remaining;
      playSound('tick');
    }
  }
  function start(){
    stop();
    const dur = getDuration();
    if (!dur){ ui.timerStop(); document.body.classList.remove('timer-warning'); return; }
    remaining = dur; lastTickSecond = -1; running = true;
    paint();
    intervalId = setInterval(() => {
      if (!running) return;
      remaining--;
      paint();
      if (remaining <= 0){ stop(); document.body.classList.remove('timer-warning'); onTimeout(); }
    }, 1000);
  }
  function resume(){
    if (running) return;
    if (remaining <= 0) return;
    running = true;
    intervalId = setInterval(() => {
      if (!running) return;
      remaining--;
      paint();
      if (remaining <= 0){ stop(); document.body.classList.remove('timer-warning'); onTimeout(); }
    }, 1000);
  }
  function pause(){
    running = false;
    if (intervalId){ clearInterval(intervalId); intervalId = null; }
    document.body.classList.remove('timer-warning');
  }
  function stop(){
    running = false;
    if (intervalId){ clearInterval(intervalId); intervalId = null; }
    document.body.classList.remove('timer-warning');
  }
  function hide(){ stop(); ui.timerStop(); }
  function refreshFromSettings(){
    const dur = getDuration();
    if (!dur){ stop(); ui.timerStop(); return; }
    if (running || remaining <= 0) start();
  }
  return {
    start, stop, pause, resume, hide, refreshFromSettings,
    isRunning: () => running,
    getRemaining: () => remaining
  };
}

function pauseGame(){

  document.body.classList.add('paused');

function resumeGame(){

  gamePaused = false;
  if (window._pauseStartAt){
    pausedElapsed += Date.now() - window._pauseStartAt;

  }
  document.body.classList.remove('paused');
  $('pauseOverlay').classList.add('hidden');
  $('pauseBtn').innerHTML = '<svg><use href="#icon-pause"/></svg>';
  $('pauseBtn').title = '暂停对局（空格键）';

}

      const vol = Math.max(0, Math.min(1, tmp.soundVolume));
      try{

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chess World - Offline Edition</title>

  <!-- 基本样式：覆盖或放在现有样式之后以确保叠层与展示正确 -->
  <style>
    /* 全局重置少量样式，保持页面整洁 */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Microsoft Yahei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 游戏根容器：你的游戏内容放在 #game-root（如果已有不同 id，请相应修改） */
    #game-root {
      position: relative;
      min-height: 100vh;
      width: 100%;
      overflow: hidden;
      background: #f5f5f5; /* 默认背景，游戏可能覆盖 */
    }

    /* 引导/片头遮罩层（黑色背景） */
    #intro-overlay {
      position: fixed;
      inset: 0; /* 等价 top:0;right:0;bottom:0;left:0; */
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999; /* 覆盖所有元素 */
      pointer-events: all;
    }

    /* 隐藏遮罩时使用的类：先渐隐再 display:none */
    #intro-overlay.hidden {
      opacity: 0;
      transition: opacity 300ms ease-in-out;
      pointer-events: none;
    }

    /* 文本容器 */
    .intro-content {
      color: #ffffff;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
      will-change: opacity, transform;
      animation: fadeInHoldOut 5s ease-in-out forwards;
      padding: 16px;
    }

    /* 主体文字样式 */
    .intro-content .line {
      display: block;
      font-size: clamp(20px, 4.5vw, 48px);
      line-height: 1.05;
      font-weight: 600;
      letter-spacing: 0.4px;
    }

    /* Designed by 行 */
    .intro-content .designed {
      font-size: clamp(14px, 2.2vw, 18px);
      font-weight: 400;
      margin-bottom: 8px;
      color: rgba(255,255,255,0.85);
    }

    /* 品牌文字：Horizon Studio */
    .brand {
      display: inline-block;
      font-style: italic; /* 斜体 */
      font-weight: 700;
      transform-origin: center;
      /* 立体感通过多层 text-shadow 实现 */
      text-shadow:
        0 1px 0 rgba(0,0,0,0.6),
        0 2px 0 rgba(0,0,0,0.5),
        0 3px 0 rgba(0,0,0,0.4),
        0 6px 18px rgba(0,0,0,0.6);
      padding: 6px 12px;
      border-radius: 6px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.55);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transform: translateZ(0);
    }

    /* Horizon 与 Studio 的颜色分别设置 */
    .brand .horizon {
      color: #103F97; /* 用户指定的颜色 */
      font-style: italic; /* 保持斜体 */
    }
    .brand .studio {
      color: #E14A77; /* 用户指定的颜色 */
      font-style: italic;
    }

    /* 动画关键帧：淡入 -> 保持 -> 淡出（总时长 5s）*/
    @keyframes fadeInHoldOut {
      0% {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }
      12% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      84% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-10px) scale(0.98);
      }
    }

    /* 页脚：固定在底部，浅色文字（在深色背景上可见），适当留白 */
    #site-footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9999;
      padding: 10px 16px;
      text-align: center;
      font-size: 14px;
      color: rgba(0,0,0,0.6);
      background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,0.02));
      pointer-events: auto;
    }
    #site-footer a {
      color: #103F97;
      text-decoration: none;
      font-weight: 600;
    }
    #site-footer a:hover {
      text-decoration: underline;
    }

    /* 当遮罩隐藏时，让它在 transition 完成后彻底从文档流移除（通过 display:none） */
    /* 使用一个小的 mutation observer 移除节点（见脚本）以避免视觉闪烁 */
  </style>
</head>
<body>
  <!-- 片头遮罩 -->
  <div id="intro-overlay" role="img" aria-label="Intro animation: Designed by Horizon Studio">
    <div class="intro-content" aria-hidden="true">
      <span class="designed">Designed by</span>
      <span class="line brand" aria-hidden="true">
        <span class="horizon">Horizon</span>
        <span class="studio">Studio</span>
      </span>
    </div>
  </div>

  <!-- 游戏主容器：把你原来的游戏 HTML/画布/脚本放在这里 -->
  <div id="game-root" aria-live="polite">
    <!--
      将你的游戏 HTML / canvas / 资源引用放在这里。
      如果你的游戏入口函数不是 window.startGame 或 window.initGame，
      请在下面的脚本中添加对应的函数名或保证页面中有 id="start-button" 的开始按钮以便自动触发。
    -->
    <!-- 示例占位（你可以删除或替换） -->
    <noscript>
      请启用 JavaScript 以运行游戏。
    </noscript>

    <!-- 如果原来有脚本引用（比如 game.js），把它们放在这里或在覆盖后自行恢复 -->
    <!-- <script src="js/game.js"></script> -->
  </div>

  <!-- 页脚：联系作者 -->
  <footer id="site-footer" role="contentinfo">
    contact the author <a href="https://github.com/HorzionExpress" target="_blank" rel="noopener noreferrer">https://github.com/HorzionExpress</a> &nbsp; Lemuel Li
  </footer>

  <!-- 控制逻辑：等待动画（5s）和页面加载完成后再进入游戏 -->
  <script>
    (function () {
      'use strict';

      var overlay = document.getElementById('intro-overlay');
      var content = overlay && overlay.querySelector('.intro-content');

      // Promise：监听动画结束或 6s 超时（防止某些浏览器 animationend 未触发）
      var animationPromise = new Promise(function (resolve) {
        if (!content) {
          resolve();
          return;
        }

        var finished = false;
        function onAnimationEnd(e) {
          if (finished) return;
          finished = true;
          content.removeEventListener('animationend', onAnimationEnd);
          resolve();
        }

        content.addEventListener('animationend', onAnimationEnd, false);

        // 保险超时：5s 动画 + 1s 余量
        var fallback = setTimeout(function () {
          if (finished) return;
          finished = true;
          content.removeEventListener('animationend', onAnimationEnd);
          resolve();
        }, 6000);
      });

      // Promise：等待 window load（如果已完成则立即返回）
      var loadPromise = new Promise(function (resolve) {
        if (document.readyState === 'complete') {
          resolve();
        } else {
          window.addEventListener('load', function onLoad() {
            window.removeEventListener('load', onLoad);
            resolve();
          });
        }
      });

      // 在动画与加载都完成后，隐藏遮罩并尝试调用游戏启动函数
      Promise.all([animationPromise, loadPromise]).then(function () {
        // 先渐隐遮罩
        if (overlay) {
          overlay.classList.add('hidden');

          // 等待 opacity transition 完成后从 DOM 中移除遮罩，避免影响后续布局或 tab 顺序
          // 使用 setTimeout 作为简单回退（300ms 与 CSS 中 transition 保持一致）
          setTimeout(function () {
            try {
              if (overlay && overlay.parentNode) {
                overlay.parentNode.removeChild(overlay);
              }
            } catch (e) {
              // 忽略删除错误
              console.warn('Failed to remove intro overlay:', e);
            }
          }, 350);
        }

        // 尝试调用常见的游戏启动函数（根据你的游戏实现可调整）
        try {
          if (typeof window.startGame === 'function') {
            window.startGame();
            return;
          }
          if (typeof window.initGame === 'function') {
            window.initGame();
            return;
          }
          if (typeof window.gameInit === 'function') {
            window.gameInit();
            return;
          }

          // 如果有一个明显的开始按钮（如 id="start-button"），触发点击
          var startButton = document.getElementById('start-button');
          if (startButton && typeof startButton.click === 'function') {
            startButton.click();
            return;
          }

          // 如果没有发现启动函数或按钮，则不强行修改你的游戏逻辑：
          // 仅移除遮罩并允许页面交互，游戏脚本（若等待 DOMContentLoaded 等）会自行启动。
        } catch (err) {
          // 不要中断页面；只打印错误到控制台
          console.error('Error while attempting to start the game after intro:', err);
        }
      }).catch(function (err) {
        // 意外错误回退：确保遮罩被移除以免阻塞游戏
        try {
          if (overlay && overlay.parentNode) {
            overlay.parentNode.removeChild(overlay);
          }
        } catch (e) {
          // noop
        }
        console.error('Intro/display flow failed:', err);
      });

    })();
  </script>
</body>
</html>
